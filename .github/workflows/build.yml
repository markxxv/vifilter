name: macOS AU build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build Audio Unit, Standalone and DSP tests
        run: cmake --build build --config Release --target ViFilter_AU ViFilter_Standalone ViFilterDSPTests ViFilterAnalogTests ViFilterOversamplingTests ViFilterPresetTests ViFilterProcessorTests --parallel 2
      - name: Run DSP, aliasing, preset and processor integration tests
        run: ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Validate Audio Unit with Apple's auval
        run: |
          component="build/ViFilter_artefacts/Release/AU/Vi Filter.component"
          plutil -lint "$component/Contents/Info.plist"
          plutil -p "$component/Contents/Info.plist" | head -100
          codesign --verify --deep --strict --verbose=2 "$component"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "$component" "$HOME/Library/Audio/Plug-Ins/Components/"
          # The registrar may cache the AU directory before the component is installed.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -a | grep -i 'Vi Filter' || true
          auval -v aufx Vfil Vifr

      - name: Verify universal architecture
        run: |
          au="build/ViFilter_artefacts/Release/AU/Vi Filter.component/Contents/MacOS/Vi Filter"
          standalone="build/ViFilter_artefacts/Release/Standalone/Vi Filter.app/Contents/MacOS/Vi Filter"
          lipo "$au" -verify_arch arm64 x86_64
          lipo "$standalone" -verify_arch arm64 x86_64
          lipo -archs "$au"
          lipo -archs "$standalone"

      - name: Package universal build (unsigned test installer)
        run: bash Scripts/package-macos.sh 0.6.0 build dist

      - name: Upload unsigned macOS test packages
        uses: actions/upload-artifact@v4
        with:
          name: ViFilter-v0.6.0-macOS-universal-UNSIGNED
          path: dist/*
          if-no-files-found: error
          retention-days: 30
